<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="hub-token" content="__HUB_TOKEN__">
<title>SAR debug hub</title>
<style>
:root{--bg:#0f141a;--panel:#161d26;--panel2:#121820;--line:#263040;--soft:#1c2531;--text:#dbe3ec;--mute:#8091a5;--mute2:#5b6d82;
 --ok:#3fb88b;--warn:#e0a638;--bad:#e26c6c;--info:#5c8dd6;--acc:#7aa7e8;
 --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
header.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.3px;margin-right:6px}.brand small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.fld{display:flex;flex-direction:column;gap:3px}.fld label{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
input,select{background:#0c1117;border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:1px solid var(--acc);border-color:var(--acc)}
input.num{width:118px;font-family:var(--mono)}input.sm{width:84px}input.dt{width:178px}
button.run{background:var(--acc);color:#0b1220;border:0;border-radius:5px;padding:8px 18px;font-weight:650;cursor:pointer}
button.run:disabled{background:var(--mute2);cursor:not-allowed}
button.btn{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:5px 11px;cursor:pointer}button.btn:hover{border-color:var(--acc)}
.tileinfo{font:12px var(--mono);color:var(--mute);padding-bottom:7px;max-width:520px}.tileinfo b{color:var(--text);font-weight:600}.tileinfo .bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute2)}.dot.running{background:var(--warn);animation:p 1s infinite}.dot.done{background:var(--ok)}.dot.failed{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
#banner{display:none;background:#5a1f1f;color:#ffd7d7;text-align:center;padding:5px;font-weight:650;letter-spacing:.4px;border-bottom:1px solid #8b3a3a}
nav.tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 18px;cursor:pointer;color:var(--mute);font-weight:650;letter-spacing:.5px}
nav.tabs button.on{color:var(--text);border-color:var(--acc)}nav.tabs button .c{margin-left:7px;font:11px var(--mono);color:var(--mute2)}
main{flex:1;overflow:auto;padding:16px 18px 70px}
h1{font-size:19px;letter-spacing:1.2px;margin:2px 0 14px;font-weight:700}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);margin:22px 0 8px;font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:4px 9px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600;white-space:nowrap}
td.m,.m{font-family:var(--mono);font-size:12px}td.r{text-align:right}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}
.b{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:650;letter-spacing:.3px;border:1px solid transparent;white-space:nowrap}
.b.ok,.b.READY,.b.implemented,.b.present,.b.done,.b.network{background:#12342a;color:#6fe0b6;border-color:#1f5a47}
.b.warn,.b.LAUNCHES_WITH_GAPS,.b.declarations,.b.empty,.b.INSUFFICIENT_EVIDENCE,.b.skipped,.b.clip-cache,.b.no_channel{background:#3a2e12;color:#f0c35c;border-color:#6a5420}
.b.bad,.b.fail,.b.failed,.b.BLOCKED,.b.absent,.b.missing,.b.error,.b.syntax_error,.b.no_producer,.b.stale-clip-cache,.b.broken{background:#3d1a1a;color:#ff9a9a;border-color:#7a3333}
.b.info,.b.running,.b.memory{background:#162b49;color:#93bbf5;border-color:#2c4f84}
.b.stub,.b.NOT_APPLICABLE,.b.skip,.b.not{background:#232b36;color:#93a3b6;border-color:#364252}
.b.SUPPORTED{background:#12342a;color:#6fe0b6;border-color:#1f5a47}
.b.NOT_SUPPORTED{background:#3d1a1a;color:#ff9a9a;border-color:#7a3333}
.b.UNCATALOGUED_CANDIDATE,.b.PENDING{background:#162b49;color:#93bbf5;border-color:#2c4f84}
.b.NOT_MODELLED{background:#232b36;color:#93a3b6;border-color:#364252}
.ev{margin:2px 0}.ev .claim{display:block;margin:1px 0}.ev .sup{font:11px var(--mono);color:var(--mute)}
.b.running{animation:p 1s infinite}
details{margin:0 0 8px}details>summary{cursor:pointer;padding:6px 2px;color:var(--text);font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}details>summary:before{content:"▸";display:inline-block;width:14px;color:var(--mute)}details[open]>summary:before{content:"▾"}
.sub{color:var(--mute);font-weight:400;margin-left:8px;font-size:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.lc .im{position:relative;background:repeating-conic-gradient(#1a222c 0 25%,#141b23 0 50%) 0 0/12px 12px;aspect-ratio:1/1;cursor:crosshair;display:flex;align-items:center;justify-content:center}
.lc img{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}
.lc .t{padding:6px 8px;font-size:11.5px}.lc .t b{display:block;word-break:break-all;font-weight:600}.lc .t span{color:var(--mute);font-family:var(--mono);font-size:11px;display:block}
.lc .px{padding:3px 8px;font:11px var(--mono);color:var(--acc);min-height:20px;border-top:1px solid var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font:11.5px var(--mono);padding:2px 8px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.chip.ok{border-color:#1f5a47;color:#6fe0b6}.chip.bad{border-color:#7a3333;color:#ff9a9a}.chip.warn{border-color:#6a5420;color:#f0c35c}
.tl{display:flex;gap:5px;flex-wrap:wrap}.tl a{display:block;min-width:84px;padding:6px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.tl a b{display:block;font-family:var(--mono)}.tl a span{display:block;font-size:11px;color:var(--mute)}.tl a.ok{border-color:#1f5a47}.tl a.error{border-color:#7a3333}.tl a.skipped{opacity:.65}.tl a.wait{opacity:.35}
pre{background:#0b1016;border:1px solid var(--line);border-radius:6px;padding:9px 11px;overflow:auto;max-height:340px;margin:6px 0;font:11.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word}
.note{color:var(--mute);font-size:12px}div.empty{color:var(--mute2);padding:22px 4px}
.mx td,.mx th{padding:3px 5px;text-align:center}.mx td.n,.mx th.n{text-align:left;white-space:nowrap}
.mx .c{width:30px;height:20px;border-radius:3px;display:inline-block;vertical-align:middle}
.c.ok{background:#1d6b52}.c.empty{background:#8a6a1b}.c.missing{background:#8b3535}.c.no_channel{background:#6b5a1f;background-image:repeating-linear-gradient(45deg,transparent 0 4px,#0004 4px 8px)}.c.absent{background:#8b3535}.c.none{background:transparent;border:1px dashed var(--line)}
.c.no_producer{background:#8b3535}.c.present{background:#1d6b52}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px;color:var(--mute);font-size:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
footer.live{position:fixed;left:0;right:0;bottom:0;background:#0b1016;border-top:1px solid var(--line);z-index:20}
footer.live .bar{display:flex;gap:18px;align-items:center;padding:6px 16px;font:12px var(--mono);color:var(--mute);overflow:hidden;white-space:nowrap}
footer.live .bar b{color:var(--text);font-weight:600}footer.live .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
#log{display:none;max-height:36vh;overflow:auto;border-top:1px solid var(--line);padding:6px 16px;font:11.5px var(--mono)}#log div{padding:1px 0;color:var(--mute)}#log .k-error{color:var(--bad)}#log .k-warn{color:var(--warn)}#log .k-step,#log .k-retrieval,#log .k-done{color:var(--ok)}#log .k-call,#log .k-call_end{color:var(--acc)}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center}#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:94vw;max-height:94vh;overflow:auto;padding:12px 14px}
#modal img{max-width:88vw;max-height:70vh;image-rendering:pixelated;display:block;cursor:crosshair;background:#0b1016}
.spark{display:block;width:100%;height:46px}
.err{color:var(--bad)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SAR DEBUG HUB<small>real engine path · observe only</small></div>
  <div class="fld"><label for="lat">latitude</label><input id="lat" class="num" inputmode="decimal" value="34.0500" autocomplete="off"></div>
  <div class="fld"><label for="lon">longitude</label><input id="lon" class="num" inputmode="decimal" value="-118.2500" autocomplete="off"></div>
  <div class="tileinfo" id="tileinfo">…</div>
  <div class="fld"><label for="asof">as of (UTC, blank = now)</label><input id="asof" class="dt" placeholder="2026-10-25T00:00:00Z"></div>
  <div class="fld"><label for="lookback">lookback days</label><input id="lookback" class="sm" inputmode="numeric"></div>
  <div class="fld" id="srcbox" style="display:none"><label for="src">source</label><select id="src"></select></div>
  <div class="fld" id="ancbox" style="display:none"><label for="anc">synthetic ancillary</label><select id="anc"><option value="0">no</option><option value="1">yes</option></select></div>
  <button class="run" id="run">RUN</button>
  <span class="pill" id="jobpill"><span class="dot" id="jobdot"></span><span id="jobtxt">no job yet</span></span>
</header>
<div id="banner"></div>
<nav class="tabs" id="tabs">
  <button data-t="retrieval" class="on">DATA RETRIEVAL<span class="c" id="c-retrieval"></span></button>
  <button data-t="health">HEALTH<span class="c" id="c-health"></span></button>
  <button data-t="processing">DATA PROCESSING<span class="c" id="c-processing"></span></button>
  <button data-t="pipelines">PIPELINES<span class="c" id="c-pipelines"></span></button>
</nav>
<main id="main"></main>
<footer class="live">
  <div class="bar"><span><span class="dot" id="fdot"></span> <b id="fstate">idle</b></span><span id="fstage">–</span><span id="felapsed">0.0 s</span>
    <span id="fnet">net: –</span><span class="grow" id="flast">–</span><button class="btn" id="logbtn">log ▴</button></div>
  <div id="log"></div>
</footer>
<div id="modal"><div class="box" id="modalbox"></div></div>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name=hub-token]').content;
const S = {tab:"retrieval", cfg:null, job:null, jobId:null, events:[], net:[], health:null, healthErr:null, open:new Set(), es:null,
           tile:null, netcheck:null, tests:null, showAll:new Set(), t0:null, timer:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fB = n => n == null ? "–" : n < 1024 ? n + " B" : n < 1048576 ? (n/1024).toFixed(1) + " KB" : n < 1073741824 ? (n/1048576).toFixed(1) + " MB" : (n/1073741824).toFixed(2) + " GB";
const fN = (v, d=4) => v == null ? "–" : (typeof v !== "number" ? esc(v) : (Number.isInteger(v) ? v.toLocaleString() : (Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-3)) ? v.toExponential(3) : +v.toPrecision(d) + ""));
const badge = (s, txt) => `<span class="b ${esc(String(s).replace(/[^\w-]/g,""))}">${esc(txt ?? s)}</span>`;
async function api(path, opt={}) {
  const r = await fetch(path, {...opt, headers:{...(opt.headers||{}), "X-Hub-Token": TOKEN, "Content-Type":"application/json"}});
  const j = await r.json().catch(() => ({error: "non-JSON response (" + r.status + ")"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const J = () => S.job || {};

/* ------------------------------------------------------------------ coordinates (live) */
function parsePair(t) { const m = String(t).match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/); return m ? [parseFloat(m[1]), parseFloat(m[2])] : null; }
["lat","lon"].forEach(id => $(id).addEventListener("input", e => {
  const p = parsePair(e.target.value);
  if (p) { $("lat").value = p[0]; $("lon").value = p[1]; }          // "lat, lon" pasted into either box
  clearTimeout(S.tt); S.tt = setTimeout(updateTile, 180);
}));
async function updateTile() {
  const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
  if (!isFinite(lat) || !isFinite(lon)) { $("tileinfo").innerHTML = '<span class="bad">enter numeric lat / lon</span>'; S.tile = null; return; }
  try {
    const t = await api(`/api/tile?lon=${lon}&lat=${lat}`);
    S.tile = t;
    $("tileinfo").innerHTML = `tile <b>${esc(t.id)}</b> · EPSG:${t.epsg} · ${t.size_m / 1000} km · lon ${t.bbox[0].toFixed(4)}…${t.bbox[2].toFixed(4)} · lat ${t.bbox[1].toFixed(4)}…${t.bbox[3].toFixed(4)} · fetch margin ${t.margin_m} m`;
  } catch (e) { S.tile = null; $("tileinfo").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}

/* ------------------------------------------------------------------ run / live events */
$("run").onclick = async () => {
  const body = {lat: parseFloat($("lat").value), lon: parseFloat($("lon").value), as_of: $("asof").value.trim() || null,
                lookback_days: parseFloat($("lookback").value) || null, source: $("src").value, synthetic_ancillary: $("anc").value === "1"};
  if (!isFinite(body.lat) || !isFinite(body.lon)) { alert("latitude and longitude must be numbers"); return; }
  try { const j = await api("/api/run", {method:"POST", body: JSON.stringify(body)}); attach(j.id); }
  catch (e) { alert("could not start: " + e.message); }
};
function attach(id) {
  if (S.es) S.es.close();
  S.jobId = id; S.events = []; S.net = []; S.job = {id, state:"running", steps:[], retrieval:null, final:null, handoff:null};
  S.t0 = Date.now(); $("log").innerHTML = ""; render();
  const es = S.es = new EventSource(`/api/events?id=${id}&after=0`);
  es.onmessage = m => onEvent(JSON.parse(m.data));
  es.addEventListener("end", () => { es.close(); refresh(); });
  es.onerror = () => { /* the server closes the stream when the job ends; refresh settles the final state */ };
  clearInterval(S.timer); S.timer = setInterval(tick, 200);
}
function onEvent(e) {
  S.events.push(e);
  const d = document.createElement("div"); d.className = "k-" + e.kind;
  d.textContent = `${e.t.toFixed(2).padStart(7)}s  ${e.kind.padEnd(9)} ${e.stage || ""}  ${e.msg}`;
  const L = $("log"), stick = L.scrollTop + L.clientHeight >= L.scrollHeight - 8; L.appendChild(d); if (stick) L.scrollTop = L.scrollHeight;
  if (e.kind === "net") S.net.push([e.t, e.data.bytes_fetched || 0, e.data.requests || 0]);
  if (e.kind === "job" && e.data.tile) { J().tile = e.data.tile; }
  if (e.kind === "job" && e.data.source) { J().source = e.data.source; banner(); }
  $("fstage").textContent = e.stage || "–"; $("flast").textContent = e.msg;
  if (e.kind === "net") liveNet(e.data);
  if (["retrieval","step","final","handoff","pipelines","done","error","job"].includes(e.kind)) { clearTimeout(S.rt); S.rt = setTimeout(refresh, 300); }
  else if (S.tab === "retrieval" && ["call","call_end","warn"].includes(e.kind)) { clearTimeout(S.lt); S.lt = setTimeout(renderLiveBits, 120); }
}
async function refresh() {
  if (!S.jobId) return;
  try { S.job = await api(`/api/job?id=${S.jobId}&part=all`); } catch (e) { return; }
  if (S.job.state === "done" || S.job.state === "failed") { clearInterval(S.timer); tick(); }
  banner(); render();
}
function tick() {
  const j = J(), run = j.state === "running" || j.state === "queued";
  const el = run ? (Date.now() - S.t0) / 1000 : (j.seconds ?? 0);
  $("felapsed").textContent = el.toFixed(1) + " s";
  const st = j.state || "idle"; $("fstate").textContent = st; $("fdot").className = "dot " + st; $("jobdot").className = "dot " + st;
  $("jobtxt").textContent = j.id ? `${j.id} · ${st}${j.tile && j.tile.id ? " · " + j.tile.id : ""}` : "no job yet";
  $("run").disabled = run;
}
function liveNet(m) {
  $("fnet").innerHTML = `net: <b>${m.requests ?? 0}</b> req · <b>${fB(m.bytes_fetched)}</b> wire · <b>${fB(m.bytes_useful)}</b> useful · retries <b>${m.retries ?? 0}</b>`;
  const el = $("livenet"); if (el) el.innerHTML = netPanelInner(m);
}
function banner() {
  const b = $("banner"), s = J().source;
  if (s && s.kind === "selftest") { b.style.display = "block"; b.textContent = "SELF-TEST SOURCE: synthetic fixture arrays, NOT NISAR data. Used only to test this hub."; }
  else b.style.display = "none";
}
$("logbtn").onclick = () => { const L = $("log"); const on = L.style.display !== "block"; L.style.display = on ? "block" : "none"; $("logbtn").textContent = on ? "log ▾" : "log ▴"; if (on) L.scrollTop = L.scrollHeight; };

/* ------------------------------------------------------------------ tabs */
$("tabs").onclick = e => { const t = e.target.closest("button"); if (!t) return; S.tab = t.dataset.t;
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b === t)); if (S.tab === "health" && !S.health) loadHealth(); render(); };
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.target.open ? S.open.add(k) : S.open.delete(k); }, true);
const det = (k, summary, body, dflt=false) => `<details data-k="${esc(k)}" ${(S.open.has(k) || (dflt && !S.open.has("!" + k))) ? "open" : ""}><summary>${summary}</summary>${body}</details>`;
document.addEventListener("click", e => { const t = e.target.closest("[data-showall]"); if (t) { S.showAll.add(t.dataset.showall); render(); } });

function render() {
  const m = $("main"), top = m.scrollTop;
  m.innerHTML = S.tab === "retrieval" ? viewRetrieval() : S.tab === "health" ? viewHealth() : S.tab === "pipelines" ? viewPipelines() : viewProcessing();
  m.scrollTop = top; badges(); tick();
}
function badges() {
  const j = J(), r = j.retrieval;
  $("c-retrieval").textContent = r ? `${r.clips.length} clips · ${r.n_layers} layers` : (S.jobId ? "…" : "");
  $("c-processing").textContent = (j.steps && j.steps.length) ? `${j.steps.length}/13` : "";
  const P = j.pipelines;
  if (P && P.pipelines) { const st = Object.values(P.pipelines).map(p => p.status); $("c-pipelines").textContent = st.length ? st.join(" · ") : ""; }
  else $("c-pipelines").textContent = P && P.error ? "error" : (S.jobId ? "…" : "");
  const h = S.health; if (h) { const bad = h.imports.filter(i => i.kind === "broken").length + h.independence.violations.length + h.dependencies.filter(d => !d.installed && !d.optional_lazy).length; $("c-health").textContent = bad ? bad + " issue" + (bad > 1 ? "s" : "") : "ok"; }
}

/* ------------------------------------------------------------------ shared widgets */
function imgUrl(aid, v, o={}) { return `/api/img?id=${S.jobId}&aid=${aid}&v=${encodeURIComponent(v || "")}${o.cmap ? "&cmap=" + o.cmap : ""}${o.lo != null && o.lo !== "" ? "&lo=" + o.lo : ""}${o.hi != null && o.hi !== "" ? "&hi=" + o.hi : ""}${o.max ? "&max=" + o.max : ""}`; }
function statLine(s) {
  if (!s) return "";
  const p = [];
  if (s.finite_frac != null) p.push(`valid ${(s.finite_frac * 100).toFixed(1)}%`);
  if (s.min != null) p.push(`min ${fN(s.min)}`, `max ${fN(s.max)}`);
  if (s.mean != null) p.push(`mean ${fN(s.mean)}`);
  if (s.n_unique != null) p.push(`${s.n_unique} distinct`);
  if (s.zero_frac != null) p.push(`zero ${(s.zero_frac * 100).toFixed(1)}%`);
  return p.join(" · ");
}
function layerCard(a, ver) {
  const st = a.stats || {}, title = a.name || a.label || a.path || "";
  const sub = a.role ? `role ${esc(a.role)}${a.pol ? " · " + esc(a.pol) : ""}` : (a.group ? `${esc(a.group)} · ${esc(a.step || "")}` : "");
  return `<div class="lc"><div class="im" data-aid="${esc(a.aid)}" data-ver="${esc(ver)}" title="click to enlarge · hover for pixel values">

function footprintSvg(r, tile) {
  const rings = r.granules.filter(g => g.footprint && g.footprint.length > 2);
  const bb = tile ? tile.bbox : null; if (!bb && !rings.length) return "";
  let xs = [], ys = []; rings.forEach(g => g.footprint.forEach(p => { xs.push(p[0]); ys.push(p[1]); })); if (bb) { xs.push(bb[0], bb[2]); ys.push(bb[1], bb[3]); }
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), lat = (y0 + y1) / 2, k = Math.cos(lat * Math.PI / 180);
  const W = 520, pad = 14, sx = (W - 2 * pad) / Math.max(1e-6, (x1 - x0) * k), H = Math.min(380, Math.max(160, (y1 - y0) * sx + 2 * pad)), s = Math.min(sx, (H - 2 * pad) / Math.max(1e-6, y1 - y0));
  const X = x => pad + (x - x0) * k * s, Y = y => H - pad - (y - y0) * s, col = {GUNW: "#7aa7e8", GCOV: "#e0a638"};
  const polys = rings.map(g => `<polygon points="${g.footprint.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}" fill="${col[g.product] || "#8091a5"}" fill-opacity=".10" stroke="${col[g.product] || "#8091a5"}" stroke-opacity=".6"><title>${esc(g.id)}</title></polygon>`).join("");
  const tb = bb ? `<rect x="${X(bb[0])}" y="${Y(bb[3])}" width="${Math.max(2, X(bb[2]) - X(bb[0]))}" height="${Math.max(2, Y(bb[1]) - Y(bb[3]))}" fill="#e26c6c" fill-opacity=".35" stroke="#ff9a9a"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:#0b1016;border:1px solid var(--line);border-radius:6px">${polys}${tb}</svg>
    <div class="note">footprints as returned by the search (blue = GUNW, amber = GCOV); red = the requested tile. ${rings.length}/${r.granules.length} granules carry a footprint.</div>`;
}
function callsTable(calls) {

  return `<table><tr><th>#</th><th>call</th><th>product</th><th>detail</th><th class="r">seconds</th><th>result</th><th>network Δ</th></tr>${calls.map(c => {
    const a = c.args || {}, rs = c.result || {}, nd = c.net_delta || {};
    const det = c.method === "search" ? `bbox ${(a.bbox || []).map(v => (+v).toFixed(3)).join(", ")} · ${esc((a.t0 || "").slice(0, 10))} → ${esc((a.t1 || "").slice(0, 10))}`
      : `${(a.granules || []).length} granule(s) · layers <span title="${esc(a.layers)}">${esc((a.layers || "").slice(0, 60))}${(a.layers || "").length > 60 ? "…" : ""}</span>`;
    const res = c.ok === false ? `${badge("failed", "FAILED")} ${esc(c.error)}` : c.ok == null ? badge("running", "running…")
      : c.method === "search" ? `${rs.n_granules ?? "?"} granules${rs.degraded ? " " + badge("warn", "stale cache") : ""}` : `${rs.n_clips ?? 0} clips · ${rs.n_errors ?? 0} err · ${rs.n_skipped ?? 0} skipped${rs.degraded ? " " + badge("warn", "degraded") : ""}`;
    return `<tr><td class="m">${c.n}</td><td class="m">${esc(c.method)}</td><td class="m">${esc(a.product)}</td><td>${det}</td><td class="m r">${c.seconds ?? "…"}</td><td>${res}</td>
      <td class="m">${nd.requests != null ? `${nd.requests} req · ${fB(nd.bytes_fetched)}` : "–"}</td></tr>`; }).join("")}</table>`;
}
function liveCalls() {   // before the retrieval payload exists, rebuild the call table from the event stream

   <div style="overflow:auto"><table><tr><th>pipeline</th><th>fed?</th><th>routing (P12)</th><th>inputs it declares (uses)</th><th>own fetch (pipeline pulls these itself)</th><th>run()</th></tr>${H.rows.map(r => {

      <td>${rt ? badge(rt.applies === "yes" ? "ok" : rt.applies === "no" ? "skip" : "warn", rt.applies + (rt.proxy ? " (proxy)" : "")) : "–"}<div class="note">${esc(why)}</div>${rt && rt.needs.length ? `<div class="note err">needs: ${esc(rt.needs.join("; "))}</div>` : ""}</td>
      <td><div class="chips">${r.uses.map(u => `<span class="chip ${u.state === "present" ? "ok" : "bad"}" title="${esc(u.name + ": " + u.why)}">${esc(u.code)}</span>`).join("") || "–"}</div></td>
      <td><div class="chips">${r.own_fetch.map(u => `<span class="chip ${u.state === "present" ? "ok" : "bad"}" title="${esc(u.name + ": " + u.why)}">${esc(u.code)}</span>`).join("") || "–"}</div></td>
      <td>${badge(r.implemented ? "ok" : "bad", r.implemented ? "yes" : "no")}</td></tr>`; }).join("")}</table></div>
   <div class="note" style="margin-top:6px">uses: green = present in this bundle, red = absent or no producer. own fetch: green = an adapter/source exists, red = nothing in the repo can supply it yet. Hover a chip for the reason.</div>`;

  if (row) {
    h += `<div class="grid2"><div>${kv([["pipeline", `${esc(row.code)} ${esc(row.name)}`], ["sensor", esc(row.sensor || "–")], ["min_epochs", row.min_epochs ?? "–"], ["implemented (run() defined)", badge(row.implemented ? "ok" : "bad", row.implemented ? "yes" : "NO")], ["registry feed", badge(row.feed)]])}</div>
      <div>${kv([["routing (P12)", row.routing ? badge(row.routing.applies === "yes" ? "ok" : row.routing.applies === "no" ? "skip" : "warn", row.routing.applies + (row.routing.proxy ? " (proxy)" : "")) : "–"], ["routing reasons", esc(((row.reasons && row.reasons.length ? row.reasons : (row.routing ? row.routing.reasons : [])) || []).join(" · ")) || "–"], ["own fetch (adapters)", `<div class="chips">${row.own_fetch.map(u => `<span class="chip ${u.state === "present" ? "ok" : "bad"}" title="${esc(u.name + ": " + u.why)}">${esc(u.code)}</span>`).join("") || "–"}</div>`]])}</div></div>`;
    h += `<div class="note" style="margin-top:8px">Declared bundle inputs (uses)</div><div class="chips">${row.uses.map(u => `<span class="chip ${u.state === "present" ? "ok" : "bad"}" title="${esc(u.name + ": " + u.why)}">${esc(u.code)} ${esc(u.name || "")}</span>`).join("") || "–"}</div>`;
  }
  const d = P.detail || {};
  const sel = (d.pairs_analysed || []).find(p => p.selected);
  if (sel) h += `<div class="note" style="margin-top:10px">Measurement pair the pipeline selected</div><div class="chips"><span class="chip">${esc((sel.ref_time || "").slice(0, 10))} → ${esc((sel.sec_time || "").slice(0, 10))}</span><span class="chip">${(sel.granule_ids || []).length} granule(s)</span><span class="chip">valid px ${fN(sel.valid_pixels, 0)}</span><span class="chip">ref offset ${(sel.ref_offset_m * 1000).toFixed(2)} mm</span><span class="chip">ref σ ${(sel.ref_sigma_m * 1000).toFixed(2)} mm</span></div><div class="note m" style="margin-top:3px">${esc((sel.granule_ids || []).join(" · "))}</div>`;
  if (F && groups.length) h += `<div class="note" style="margin-top:10px">Bundle arrays this pipeline reads (from DATA PROCESSING; the same arrays, unchanged)</div>${groups.filter(g => F[g] && F[g].length).map(g => det("plin:" + name + ":" + g, `${esc(g)} <span class="sub">${F[g].length}</span>`, `<div class="gal">${F[g].slice(0, 8).map(a => layerCard(a, a.step)).join("")}</div>`)).join("")}`;
  return h + `</div>`;
}
function plCard(name, P, H, F) {
  const row = H && H.rows ? H.rows.find(r => r.name === name) : null;
  const code = row ? row.code : "";
  const sub = P.launched ? `ran in ${fN(P.runtime_s, 2)} s` : `registry decision: ${P.status}`;
  const body = plInput(name, P, row, F) + plOutput(name, P);
  return det("pl:" + name, `<span class="m">${esc(code)}</span> ${esc(name)} ${plStatus(P)}<span class="sub">${esc(sub)}${(P.layers_store || []).length ? " · " + P.layers_store.length + " layer(s)" : ""}</span>`, body, name === "earthquake_coseismic");
}
function viewPipelines() {
  const j = J();
  let h = `<h1>PIPELINES</h1>`;
  h += `<div class="card"><div class="note">The featured pipelines run through the <b>real registry path</b> — plan (P12 routing + gate) → launch → collect — on exactly the bundle DATA PROCESSING produced; the pipeline sees only the bundle, and everything external arrives through its own fetch adapters. Click a pipeline to expand its input and output. A pipeline routing declined is shown with the registry's own answer and reasons — never silently hidden.</div>
    <div class="chips" style="margin-top:8px"><span class="chip">registry.run_unknown <b>${esc(j.handoff ? j.handoff.run_unknown : "–")}</b></span><span class="chip">pipelines with run(): <b>${j.handoff ? j.handoff.n_implemented : "–"}</b> / ${j.handoff ? j.handoff.rows.length : "–"}</span></div></div>`;
  if (!S.jobId) return h + `<div class="card empty">Run a tile first (top left). The pipelines consume the SceneBundle that run produces.</div>`;
  const P = j.pipelines;
  if (!P) return h + `<div class="card empty">${j.state === "running" ? "the featured pipelines run after the chain finishes…" : "no pipeline result in this job"}</div>`;
  if (P.error) return h + `<div class="card">${badge("bad", "PIPELINE RUNNER FAILED")}<pre>${esc(P.trace || P.error)}</pre></div>`;
  const H = j.handoff, F = j.final && j.final.final_arrays;
  const order = P.names && P.names.length ? P.names : Object.keys(P.pipelines);
  h += order.map(n => P.pipelines[n] ? plCard(n, P.pipelines[n], H, F) : `<div class="card empty">${esc(n)}: no result</div>`).join("");
  (P.missing || []).forEach(n => { h += `<div class="card empty">${esc(n)}: not present in this checkout</div>`; });
  if (P.providers_used && Object.keys(P.providers_used).length) h += `<div class="card">${badge("warn", "SELFTEST INJECTION")}<div class="note" style="margin-top:4px">${esc(Object.entries(P.providers_used).map(([k, v]) => `${k}: ${v}`).join(" | "))}</div></div>`;
  return h;
}

/* ------------------------------------------------------------------ boot */
(async function boot() {
  try {
    S.cfg = await api("/api/config");
    $("lookback").placeholder = S.cfg.lookback_days;
    if (S.cfg.sources.length > 1) { $("srcbox").style.display = ""; $("src").innerHTML = S.cfg.sources.map(s => `<option>${s}</option>`).join(""); $("src").onchange = () => { $("ancbox").style.display = $("src").value === "selftest" ? "" : "none"; }; }
    else $("src").innerHTML = `<option>${S.cfg.sources[0]}</option>`;
    const last = S.cfg.jobs[0]; if (last) { attach(last.id); }
  } catch (e) { $("tileinfo").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  updateTile(); render(); tick(); loadHealth();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>retrieval · debug</title>
<style>
  :root{
    --bg:#10151b; --panel:#161d27; --panel-2:#131920; --line:#263040; --line-soft:#1d2530;
    --text:#dce4ec; --muted:#7c8da1; --muted-2:#56687c;
    --pending:#5c8dd6; --claimed:#e0a638; --done:#3fb88b; --superseded:#8d7fa8; --bad:#e26c6c;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:13.5px; line-height:1.45;
  }
  a{color:inherit}
  .app{display:flex; min-height:100vh}

  /* ---- left rail ---- */
  .rail{
    width:230px; flex:none; background:var(--panel-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 14px;
  }
  .brand{font-weight:600; letter-spacing:.2px; font-size:14px}
  .brand small{display:block; color:var(--muted); font-weight:400; font-size:11.5px; margin-top:2px}
  .conn{display:flex; align-items:center; gap:7px; margin:16px 0 20px; font-size:12px; color:var(--muted)}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--muted-2); flex:none}
  .dot.live{background:var(--done); box-shadow:0 0 0 3px rgba(63,184,139,.18)}
  .dot.bad{background:var(--bad); box-shadow:0 0 0 3px rgba(226,108,108,.18)}
  nav{display:flex; flex-direction:column; gap:2px; margin-top:4px}
  nav button{
    all:unset; cursor:pointer; padding:8px 10px; border-radius:5px; color:var(--muted);
    font-size:13px; display:flex; justify-content:space-between; align-items:center;
  }
  nav button:hover{background:var(--line-soft); color:var(--text)}
  nav button.active{background:var(--line-soft); color:var(--text); box-shadow:inset 2px 0 0 var(--pending)}
  nav button .n{font-family:var(--mono); font-size:11.5px; color:var(--muted-2)}
  nav button.active .n{color:var(--muted)}
  .rail-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted-2)}
  .rail-foot code{font-family:var(--mono); color:var(--muted)}
  .refresh-row{display:flex; gap:6px; margin-top:10px}
  .btn{
    all:unset; cursor:pointer; font-size:11.5px; padding:5px 9px; border-radius:4px;
    border:1px solid var(--line); color:var(--muted); font-family:var(--sans);
  }
  .btn:hover{color:var(--text); border-color:var(--muted-2)}
  .btn.on{color:var(--done); border-color:rgba(63,184,139,.4)}

  /* ---- main ---- */
  main{flex:1; min-width:0; padding:22px 28px 60px; overflow-x:hidden}
  h1{font-size:15px; margin:0 0 3px; font-weight:600}
  .sub{color:var(--muted); font-size:12.5px; margin:0 0 20px}
  .empty{
    border:1px dashed var(--line); border-radius:6px; padding:28px; color:var(--muted);
    font-size:13px; max-width:560px;
  }
  .empty code{font-family:var(--mono); background:var(--panel); padding:1px 5px; border-radius:3px; color:var(--text)}

  /* stat strip */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-bottom:22px}
  .stat{background:var(--panel); padding:13px 15px}
  .stat .v{font-family:var(--mono); font-size:20px; font-weight:600}
  .stat .l{color:var(--muted); font-size:11px; margin-top:3px; text-transform:lowercase}
  .stat .v.pending{color:var(--pending)} .stat .v.claimed{color:var(--claimed)}
  .stat .v.done{color:var(--done)} .stat .v.superseded{color:var(--superseded)}
  .stat .v.bad{color:var(--bad)}

  section.panel{background:var(--panel); border:1px solid var(--line); border-radius:7px; margin-bottom:18px}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:11px 15px; border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:12.5px; margin:0; font-weight:600; color:var(--text)}
  .panel-head .hint{font-size:11.5px; color:var(--muted-2)}
  .panel-body{padding:14px 15px}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media (max-width:860px){ .grid2{grid-template-columns:1fr} .rail{position:static; width:100%; flex-direction:row; align-items:center; gap:16px} nav{flex-direction:row; flex-wrap:wrap} .rail-foot{display:none} }

  table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
  thead th{
    text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; text-transform:lowercase;
    padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--panel);
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top; white-space:nowrap}
  tbody tr:hover{background:var(--line-soft)}
  td.wrap, th.wrap{white-space:normal; word-break:break-all}
  .scroll{max-height:460px; overflow:auto}

  .badge{display:inline-block; padding:1.5px 7px; border-radius:3px; font-size:10.5px; font-family:var(--mono)}
  .badge.pending{color:var(--pending); background:rgba(92,141,214,.12)}
  .badge.claimed{color:var(--claimed); background:rgba(224,166,56,.12)}
  .badge.done{color:var(--done); background:rgba(63,184,139,.12)}
  .badge.superseded{color:var(--superseded); background:rgba(141,127,168,.12)}
  .badge.err{color:var(--bad); background:rgba(226,108,108,.12)}
  .badge.stale{color:var(--claimed); background:rgba(224,166,56,.12)}
  .muted{color:var(--muted)}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .filters input, .filters select{
    all:unset; background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    padding:6px 9px; font-size:12px; color:var(--text); font-family:var(--sans);
  }
  .filters input{min-width:220px}
  .filters input:focus, .filters select:focus{border-color:var(--muted-2)}

  .bar{height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden; display:flex}
  .bar span{height:100%}

  .store-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
  .store-row:last-child{border-bottom:none}
  .store-row .name{width:130px; flex:none; font-size:12.5px}
  .store-row .bar{flex:1}
  .store-row .size{width:150px; flex:none; text-align:right; font-family:var(--mono); font-size:12px; color:var(--muted)}

  .prod-row{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft)}
  .prod-row:last-child{border-bottom:none}
  .prod-row .name{width:70px; flex:none; font-family:var(--mono); font-weight:600}
  .prod-row .counts{flex:1; display:flex; gap:18px; font-family:var(--mono); font-size:12px; color:var(--muted)}
  .prod-row .counts b{color:var(--text); font-weight:600}
  .prod-row .last{width:190px; flex:none; text-align:right; font-size:11.5px; color:var(--muted)}

  .tag{font-family:var(--mono); font-size:10.5px; color:var(--muted-2)}
  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">retrieval · debug<small>read-only view of engine/retrieval/state.py</small></div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></div>
    <nav id="nav">
      <button data-tab="overview" class="active">overview</button>
      <button data-tab="granules">granules <span class="n" id="navGranules"></span></button>
      <button data-tab="queue">queue <span class="n" id="navQueue"></span></button>
      <button data-tab="pollog">poll log</button>
      <button data-tab="storage">storage</button>
    </nav>
    <div class="refresh-row">
      <button class="btn on" id="autoBtn">auto 15s</button>
      <button class="btn" id="refreshBtn">refresh</button>
    </div>
    <div class="rail-foot">
      data dir<br><code id="dataDir">—</code>
    </div>
  </aside>

  <main>
    <div id="tab-overview"></div>
    <div id="tab-granules" style="display:none"></div>
    <div id="tab-queue" style="display:none"></div>
    <div id="tab-pollog" style="display:none"></div>
    <div id="tab-storage" style="display:none"></div>
  </main>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
let snap = null, autoOn = true, timer = null;

function fmtBytes(n){
  if(!n) return "0 B";
  const u=["B","KB","MB","GB","TB"]; let i=0;
  while(n>=1024 && i<u.length-1){n/=1024;i++;}
  return (i===0? n : n.toFixed(1)) + " " + u[i];
}
function fmtTime(ts){
  if(!ts) return "—";
  const d = new Date(ts*1000);
  return d.toLocaleString(undefined,{month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function ago(ts){
  if(!ts) return "—";
  const s = Date.now()/1000 - ts;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function badge(status){ return `<span class="badge ${status}">${status}</span>`; }

async function load(){
  try{
    const r = await fetch("/api/snapshot", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    snap = await r.json();
    $("#connDot").className = "dot live"; $("#connText").textContent = "live · " + new Date().toLocaleTimeString();
    $("#dataDir").textContent = snap.data_dir;
    $("#navGranules").textContent = snap.granules_total ?? "";
    $("#navQueue").textContent = snap.queue_total ?? "";
    render();
  }catch(e){
    $("#connDot").className = "dot bad"; $("#connText").textContent = "disconnected";
  }
}

function render(){
  const tab = $("nav button.active").dataset.tab;
  if(tab==="overview") renderOverview();
  if(tab==="granules") renderGranules();
  if(tab==="queue") renderQueue();
  if(tab==="pollog") renderPollLog();
  if(tab==="storage") renderStorage();
}

function emptyState(){
  return `<div class="empty">No <code>state.sqlite</code> found yet at<br><code>${esc(snap.state_db)}</code>.
    <br><br>This view fills in once the granule poller has run at least one pass —
    <code>python tools/poll_granules.py</code> — or point it at sample data with
    <code>python tools/debug_view.py --demo</code>.</div>`;
}

// ---------------------------------------------------------------- overview
function renderOverview(){
  const el = $("#tab-overview");
  el.innerHTML = `<h1>Overview</h1><p class="sub">What the retrieval layer has discovered and queued, as of ${fmtTime(snap.generated_at)}.</p>`;
  if(!snap.db_exists){ el.innerHTML += emptyState(); return; }
  const s = snap.summary, q = s.queue;
  el.innerHTML += `
    <div class="stats">
      <div class="stat"><div class="v">${s.total_granules}</div><div class="l">granules loaded</div></div>
      <div class="stat"><div class="v">${s.active_granules}</div><div class="l">active (current version)</div></div>
      <div class="stat"><div class="v superseded">${s.superseded_granules}</div><div class="l">superseded</div></div>
      <div class="stat"><div class="v pending">${q.pending}</div><div class="l">tiles pending</div></div>
      <div class="stat"><div class="v claimed">${q.claimed}</div><div class="l">tiles in flight</div></div>
      <div class="stat"><div class="v done">${q.done}</div><div class="l">tiles done</div></div>
    </div>
    <div class="grid2">
      <section class="panel">
        <div class="panel-head"><h2>By product</h2><span class="hint">last poll · last granule start</span></div>
        <div class="panel-body" id="ovProducts"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Queue status</h2><span class="hint">${snap.queue_total} tiles total</span></div>
        <div class="panel-body" id="ovQueueBar"></div>
      </section>
    </div>`;

  const cfg = snap.config.poll, intervalS = (cfg.interval_hours||6)*3600;
  const prodHtml = Object.keys(s.by_product).sort().map(p=>{
    const row = s.by_product[p];
    const lp = s.last_poll[p];
    let pollBadge = `<span class="muted">never polled</span>`;
    if(lp){
      const overdue = (Date.now()/1000 - lp.ts) > intervalS*2;
      if(lp.error) pollBadge = badge("err") + ` <span class="muted">${esc(lp.error)}</span>`;
      else if(overdue) pollBadge = badge("stale") + ` <span class="muted">${ago(lp.ts)}</span>`;
      else pollBadge = `<span class="muted">${ago(lp.ts)} · found ${lp.found}, new ${lp.new}</span>`;
    }
    return `<div class="prod-row">
      <div class="name">${esc(p)}</div>
      <div class="counts"><span><b>${row.total}</b> total</span><span><b>${row.active}</b> active</span>${pollBadge}</div>
      <div class="last">${row.last_start ? esc(row.last_start) : "—"}</div>
    </div>`;
  }).join("") || `<span class="muted">no granules yet</span>`;
  $("#ovProducts").innerHTML = prodHtml;

  const total = Math.max(1, snap.queue_total);
  const segs = [["pending","var(--pending)"],["claimed","var(--claimed)"],["done","var(--done)"],["superseded","var(--superseded)"]];
  const barHtml = `<div class="bar">${segs.map(([k,c])=>`<span style="width:${(q[k]/total*100)}%;background:${c}"></span>`).join("")}</div>
    <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
      ${segs.map(([k])=>`<span style="font-size:11.5px">${badge(k)} <b style="font-family:var(--mono)">${q[k]}</b></span>`).join("")}
    </div>`;
  $("#ovQueueBar").innerHTML = barHtml;
}

// ---------------------------------------------------------------- granules
function renderGranules(){
  const el = $("#tab-granules");
  el.innerHTML = `<h1>Granules</h1><p class="sub">Every granule the poller has ever seen (newest first, showing ${snap.granules.length} of ${snap.granules_total}).</p>`;
  if(!snap.db_exists){ el.innerHTML += emptyState(); return; }
  const products = [...new Set(snap.granules.map(g=>g.product))].sort();
  el.innerHTML += `
    <div class="filters">
      <input id="gSearch" placeholder="search granule id or scene key…">
      <select id="gProduct"><option value="">all products</option>${products.map(p=>`<option>${esc(p)}</option>`).join("")}</select>
      <select id="gState"><option value="">active + superseded</option><option value="active">active only</option><option value="superseded">superseded only</option></select>
    </div>
    <section class="panel"><div class="scroll"><table>
      <thead><tr><th>granule id</th><th>product</th><th>version</th><th>start</th><th>first seen</th><th>status</th></tr></thead>
      <tbody id="gBody"></tbody>
    </table></div></section>`;
  const apply = () => {
    const q = $("#gSearch").value.toLowerCase(), prod = $("#gProduct").value, st = $("#gState").value;
    const rows = snap.granules.filter(g=>{
      if(prod && g.product!==prod) return false;
      if(st==="active" && g.superseded_by) return false;
      if(st==="superseded" && !g.superseded_by) return false;
      if(q && !g.granule_id.toLowerCase().includes(q) && !g.scene_key.toLowerCase().includes(q)) return false;
      return true;
    });
    $("#gBody").innerHTML = rows.map(g=>`<tr>
      <td class="wrap" title="${esc(g.url||'')}">${esc(g.granule_id)}</td>
      <td>${esc(g.product)}</td>
      <td>${g.version}</td>
      <td>${esc(g.start||"—")}</td>
      <td class="muted">${ago(g.first_seen)}</td>
      <td>${g.superseded_by ? badge("superseded")+` <span class="tag" title="${esc(g.superseded_by)}">→ newer</span>` : badge("done")+` active`}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="muted">no matches</td></tr>`;
  };
  $("#gSearch").addEventListener("input", apply);
  $("#gProduct").addEventListener("change", apply);
  $("#gState").addEventListener("change", apply);
  apply();
}

// ---------------------------------------------------------------- queue
function renderQueue(){
  const el = $("#tab-queue");
  el.innerHTML = `<h1>Tile queue</h1><p class="sub">MGRS tiles queued for processing by granules loaded above (showing ${snap.queue_items.length} of ${snap.queue_total}).</p>`;
  if(!snap.db_exists){ el.innerHTML += emptyState(); return; }
  const products = [...new Set(snap.queue_items.map(g=>g.product))].sort();
  el.innerHTML += `
    <div class="filters">
      <input id="qSearch" placeholder="search tile or granule id…">
      <select id="qProduct"><option value="">all products</option>${products.map(p=>`<option>${esc(p)}</option>`).join("")}</select>
      <select id="qStatus"><option value="">all statuses</option><option>pending</option><option>claimed</option><option>done</option><option>superseded</option></select>
    </div>
    <section class="panel"><div class="scroll"><table>
      <thead><tr><th>tile</th><th>status</th><th>product</th><th>granule id</th><th>queued</th><th>worker</th></tr></thead>
      <tbody id="qBody"></tbody>
    </table></div></section>`;
  const apply = () => {
    const q = $("#qSearch").value.toLowerCase(), prod = $("#qProduct").value, st = $("#qStatus").value;
    const rows = snap.queue_items.filter(it=>{
      if(prod && it.product!==prod) return false;
      if(st && it.status!==st) return false;
      if(q && !it.tile.toLowerCase().includes(q) && !it.granule_id.toLowerCase().includes(q)) return false;
      return true;
    });
    $("#qBody").innerHTML = rows.map(it=>`<tr>
      <td>${esc(it.tile)}</td>
      <td>${badge(it.status)}</td>
      <td>${esc(it.product)}</td>
      <td class="wrap">${esc(it.granule_id)}</td>
      <td class="muted">${ago(it.queued)}</td>
      <td class="muted">${esc(it.worker||"—")}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="muted">no matches</td></tr>`;
  };
  $("#qSearch").addEventListener("input", apply);
  $("#qProduct").addEventListener("change", apply);
  $("#qStatus").addEventListener("change", apply);
  apply();
}

// ---------------------------------------------------------------- poll log
function renderPollLog(){
  const el = $("#tab-pollog");
  el.innerHTML = `<h1>Poll log</h1><p class="sub">Each ASF diff pass: granules found, how many were new, and any error.</p>`;
  if(!snap.db_exists){ el.innerHTML += emptyState(); return; }
  const rows = snap.poll_log;
  const body = rows.map(r=>`<tr>
    <td>${fmtTime(r.ts)}</td>
    <td class="muted">${ago(r.ts)}</td>
    <td>${esc(r.product)}</td>
    <td>${r.error ? badge("err") : badge("done")}</td>
    <td>${r.found}</td>
    <td>${r.new}</td>
    <td class="wrap muted">${r.error ? esc(r.error) : "—"}</td>
  </tr>`).join("") || `<tr><td colspan="7" class="muted">no poll history yet</td></tr>`;
  el.innerHTML += `<section class="panel"><div class="scroll"><table>
    <thead><tr><th>when</th><th></th><th>product</th><th>result</th><th>found</th><th>new</th><th>error</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div></section>`;
}

// ---------------------------------------------------------------- storage
function renderStorage(){
  const el = $("#tab-storage");
  el.innerHTML = `<h1>Cache footprint</h1><p class="sub">On-disk size of each cache tier under <code style="font-family:var(--mono)">${esc(snap.data_dir)}</code>.</p>`;
  const S = snap.storage;
  const labels = {clip_cache:"clip store (zarr)", chunk_cache:"chunk cache (disk)", search_cache:"search cache", layout_index:"layout index"};
  const max = Math.max(1, ...Object.values(S).map(v=>v.bytes));
  const rows = Object.keys(labels).map(k=>{
    const v = S[k];
    const pct = v.bytes/max*100;
    return `<div class="store-row">
      <div class="name">${labels[k]}</div>
      <div class="bar"><span style="width:${pct}%;background:var(--pending)"></span></div>
      <div class="size">${v.exists ? fmtBytes(v.bytes)+" · "+v.files+" files"+(v.truncated?" (capped)":"") : "not created yet"}</div>
    </div>`;
  }).join("");
  el.innerHTML += `<section class="panel"><div class="panel-body">${rows}</div></section>`;
  const cfg = snap.config.cache;
  el.innerHTML += `<section class="panel">
    <div class="panel-head"><h2>Configured limits</h2><span class="hint">config/retrieval.yaml</span></div>
    <div class="panel-body" style="font-family:var(--mono); font-size:12px; color:var(--muted); display:flex; gap:28px; flex-wrap:wrap">
      <span>ram_chunks_mb <b style="color:var(--text)">${cfg.ram_chunks_mb}</b></span>
      <span>disk_chunks_gb <b style="color:var(--text)">${cfg.disk_chunks_gb}</b></span>
      <span>clips_gb <b style="color:var(--text)">${cfg.clips_gb}</b></span>
      <span>search ttl_s <b style="color:var(--text)">${cfg.ttl_s.search}</b></span>
    </div>
  </section>`;
}

// ---------------------------------------------------------------- nav + refresh
$$("#nav button").forEach(b=>b.addEventListener("click", ()=>{
  $$("#nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $$("main > div").forEach(d=>d.style.display="none");
  $("#tab-"+b.dataset.tab).style.display="block";
  if(snap) render();
}));
$("#refreshBtn").addEventListener("click", load);
$("#autoBtn").addEventListener("click", ()=>{
  autoOn = !autoOn;
  $("#autoBtn").classList.toggle("on", autoOn);
  $("#autoBtn").textContent = autoOn ? "auto 15s" : "auto off";
  resetTimer();
});
function resetTimer(){
  if(timer) clearInterval(timer);
  if(autoOn) timer = setInterval(load, 15000);
}
load(); resetTimer();
</script>
</body>
</html>

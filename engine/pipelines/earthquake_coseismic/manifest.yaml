# manifest.yaml — 3.01 earthquake_coseismic
# auto-scaffolded from nisar_hazard_engine.json — fill in / adjust as the pipeline is implemented

code: "3.01"
name: "earthquake_coseismic"
sensor: "NISAR"
model_type: "physics (Okada85) + optimizer"

applies: "land tiles with valid coherence; pair spans the window"

uses: "M1 (los, sigma, cc, iono floor), geometry, stable mask"
uses_codes: 
  - "M1"

own_prep: "far-field referencing (12% margin median), optional planar detrend (off by default), cycle-jump mask, detection floor = max(3*sigma, 10 mm, iono floor)"

own_fetch: "R1 (bbox+0.5 deg, M>=4, window +-1 day, within 400 km, nodal planes), R2 expected extent, S5 fault prior, R3 coseismic GNSS offsets for validation"

  - "Mw -> M0 (Hanks-Kanamori), area (Wells-Coppersmith, 2:1), uniform slip; DC3D on strided subgrid (<=400k points); BOTH nodal planes evaluated, better fit kept"
  - "consistency screen: amplitude ratio within x3 and Pearson r > 0.25"
  - "UNCATALOGUED branch: if a coherent high-gradient LOS cluster exists with no catalog event, fit one rectangular source on a quadtree-subsampled field (bounded global optimizer)"

output: "P(coseismic), event id, Mw, ratio, r, residual map, status: SUPPORTED | NOT_SUPPORTED | INSUFFICIENT_EVIDENCE | NOT_MODELLED | UNCATALOGUED_CANDIDATE"

min_epochs: null

status_values:
  - "SUPPORTED"
  - "NOT_SUPPORTED"
  - "INSUFFICIENT_EVIDENCE"
  - "NOT_MODELLED"
  - "UNCATALOGUED_CANDIDATE"

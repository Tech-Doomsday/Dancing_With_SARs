code: "3.04"
name: "landslide"
sensor: "NISAR"
model_type: "statistics + logistic prior"

applies: "land, slope >= 10 deg, not water; layover/shadow excluded"

uses: "M1 LOS, M2 sigma0 + coherence change, slope/aspect/curvature/HAND, M4 soil moisture"
uses_codes: 
  - "M1"
  - "M2"
  - "M4"


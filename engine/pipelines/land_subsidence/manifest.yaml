# manifest.yaml — 3.02 land_subsidence
# auto-scaffolded from nisar_hazard_engine.json — fill in / adjust as the pipeline is implemented

code: "3.02"
name: "land_subsidence"
sensor: "NISAR"
model_type: "physics (SBAS WLS) + statistics"

applies: "land, coherence above threshold, >= 10 pairs in a connected network"

uses: "M1 stack, P07 residual layer, stable mask, DEM"
uses_codes: 
  - "M1"
  - "P07"

own_prep: "network design (temporal baseline <= 36 days, connectivity check), loop-closure misclosure flag for unwrapping errors, common reference region, temporal coherence"

